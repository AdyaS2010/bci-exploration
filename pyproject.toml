[project]
name = "kestrel"
version = "0.1.0"
description = "Low-cost EEG (Muse 2) pipeline for honest neurofeedback and brain-state exploration."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "brainflow",
    "numpy>=2.0",
    "scipy",
    "matplotlib",
    "plotly",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pyflakes, pycodestyle, import sorting, common bug patterns, modern syntax.
select = ["E", "F", "I", "B", "UP"]
